name: flake-eval

# Evaluates the no-source-build check per system without compiling anything.
# The check's dry run does not force the package's pinned source hash.

'on':
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - nix/**
      - .github/workflows/flake-eval.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runs_on: ubuntu-latest
          - system: aarch64-linux
            runs_on: ubuntu-24.04-arm
          - system: aarch64-darwin
            runs_on: macos-latest
    runs-on: ${{ matrix.runs_on }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Evaluate no-source-build check
        env:
          SYSTEM: ${{ matrix.system }}
        run: nix build --no-link ".#packages.${SYSTEM}.headlamp-server-bin.src" ".#checks.${SYSTEM}.headlamp-server-bin-no-source-build"
