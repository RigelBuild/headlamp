name: publish-image

'on':
  push:
    tags:
      - 'v*.*.*-rigel.*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to rehearse, such as 0.45.0-rigel.1
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/rigelbuild/headlamp

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Require release-branch dispatch
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/rigel-release'
        run: |
          echo '::error::workflow_dispatch is only allowed from rigel-release' >&2
          exit 1
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Require release ancestry
        env:
          REF: ${{ github.ref }}
        run: |
          git fetch origin rigel-release:refs/remotes/origin/rigel-release
          commit="$(git rev-parse --verify "${REF}^{commit}")"
          git merge-base --is-ancestor "$commit" origin/rigel-release || {
            echo '::error::Ref is not reachable from rigel-release' >&2
            exit 1
          }
      - name: Resolve and validate version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = push ]; then
            version="${REF_NAME#v}"
          else
            version="$INPUT_VERSION"
          fi
          upstream="$(node -p "require('./app/package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rigel\.[0-9]+$ ]] || [[ "$version" != "$upstream"-rigel.* ]]; then
            echo '::error::Version must match app/package.json and use the -rigel.N suffix' >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish:
    if: github.event_name == 'push'
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

  rehearsal:
    if: github.event_name == 'workflow_dispatch'
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build rehearsal
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: mode=max

  finalize:
    if: github.event_name == 'push'
    needs: [resolve, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag image digest
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          tag="${IMAGE_NAME}:v${VERSION}"
          if existing="$(docker buildx imagetools inspect "$tag" 2>&1)"; then
            digest="$(printf '%s\n' "$existing" | awk '/^Digest:/ {print $2; exit}')"
            if [ "$digest" != "$IMAGE_DIGEST" ]; then
              echo "::error::Release tag already points to a different digest" >&2
              exit 1
            fi
          elif [[ "$existing" != *"not found"* && "$existing" != *"manifest unknown"* ]]; then
            echo "::error::Could not inspect release tag" >&2
            exit 1
          fi
          docker buildx imagetools create --tag "${IMAGE_NAME}:v${VERSION}" "${IMAGE_NAME}@${IMAGE_DIGEST}"
          echo "Published ${IMAGE_NAME}@${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          tag="v${VERSION}"
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" >/dev/null 2>&1; then
            echo "GitHub Release ${tag} already exists"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          fi
